<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Bukti Sayangku ke Aisyahummulmukmin</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Poppins:wght@300;400;500;600&display=swap');

    * {
      margin: 0; padding: 0; box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }
    html, body { height: 100%; }
    body {
      font-family: 'Poppins', sans-serif;
      background: #0a0408;
      color: #fff;
      overflow: hidden;
      user-select: none;
    }

    .stage {
      position: fixed; inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at 50% 40%, #2c1220 0%, #0a0408 70%);
    }
    .stage.active { display: flex; }

    /* ========== STAGE 1 ========== */
    .love-card {
      background: rgba(28,12,22,0.78);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: 28px;
      padding: 48px 58px;
      text-align: center;
      border: 1px solid rgba(255,120,160,0.16);
      box-shadow: 0 0 90px rgba(255,40,90,0.16);
      animation: cardIn 0.85s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: scale(0.9) translateY(24px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }
    .heart-svg {
      width: 68px; height: 68px;
      margin: 0 auto 20px; display: block;
      transition: all 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .love-card h2 {
      font-family: 'Playfair Display', serif;
      font-size: 30px; font-weight: 400; letter-spacing: 1.2px;
      color: #f8e0e8; margin-bottom: 34px;
    }
    .toggle {
      position: relative; width: 100px; height: 48px;
      background: #3a2030; border-radius: 50px; cursor: pointer;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      margin: 0 auto; border: 2px solid #5a3040;
    }
    .toggle.on {
      background: #e91e63; border-color: #ff5a8a;
      box-shadow: 0 0 36px rgba(233,30,99,0.6);
    }
    .toggle-knob {
      position: absolute; top: 3px; left: 3px;
      width: 38px; height: 38px; background: #fff; border-radius: 50%;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    }
    .toggle.on .toggle-knob { left: 55px; }
    .toggle-knob svg { width: 18px; height: 18px; }
    .toggle-label {
      position: absolute; top: 50%; transform: translateY(-50%);
      font-size: 11px; font-weight: 600; letter-spacing: 1.1px;
      color: #aaa; pointer-events: none; transition: opacity 0.3s;
    }
    .label-off { left: 54px; }
    .label-on  { left: 15px; color: #fff; opacity: 0; }
    .toggle.on .label-off { opacity: 0; }
    .toggle.on .label-on  { opacity: 1; }

    /* ========== STAGE 2 ========== */
    .game-title {
      font-family: 'Playfair Display', serif;
      font-size: 26px; color: #f0d0d8; margin-bottom: 30px;
      opacity: 0; animation: fadeUp 0.75s 0.15s forwards;
    }
    .board {
      display: grid;
      grid-template-columns: repeat(3, 84px);
      grid-template-rows: repeat(3, 84px);
      gap: 12px;
      background: rgba(40,18,32,0.55);
      padding: 18px; border-radius: 22px;
      box-shadow: 0 0 55px rgba(255,60,110,0.12);
      opacity: 0; animation: fadeUp 0.75s 0.3s forwards;
    }
    .cell {
      background: rgba(70,32,52,0.45);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: background 0.25s, transform 0.22s cubic-bezier(0.22,1,0.36,1);
      border: 1px solid rgba(255,100,150,0.12);
    }
    .cell:hover:not(.filled) {
      background: rgba(115,48,82,0.55);
      transform: scale(1.05);
    }
    .cell.filled { cursor: default; }
    .cell svg { width: 40px; height: 40px; }

    .win-text {
      margin-top: 38px; text-align: center;
      opacity: 0; transform: translateY(16px);
      transition: opacity 0.9s cubic-bezier(0.22,1,0.36,1),
                  transform 0.9s cubic-bezier(0.22,1,0.36,1);
    }
    .win-text.show { opacity: 1; transform: translateY(0); }
    .win-text h2 {
      font-family: 'Playfair Display', serif;
      font-size: 32px; color: #ff6b9d; margin-bottom: 6px;
    }
    .win-text p { font-size: 22px; color: #f0c0d0; }

    /* ========== STAGE 3 ========== */
    .meter-container { text-align: center; width: 270px; }
    .meter-arc {
      position: relative; width: 230px; height: 125px; margin: 0 auto 14px;
    }
    .meter-arc svg { width: 100%; height: 100%; overflow: visible; }
    .meter-bg {
      fill: none; stroke: #3a2030; stroke-width: 14; stroke-linecap: round;
    }
    .meter-fill {
      fill: none; stroke: url(#grad); stroke-width: 14; stroke-linecap: round;
      stroke-dasharray: 290; stroke-dashoffset: 290;
    }
    .meter-percent {
      position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%);
      font-size: 46px; font-weight: 600; color: #fff;
    }
    .meter-label {
      font-family: 'Playfair Display', serif;
      font-size: 18px; color: #e0a0b0;
    }
    .meter-bar {
      width: 100%; height: 6px; background: #3a2030;
      border-radius: 3px; margin-top: 24px; overflow: hidden;
    }
    .meter-bar-fill {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, #ff2d55, #ff6b9d, #ffb6c1);
      border-radius: 3px;
    }

    /* ========== STAGE 4 ========== */
    .main-message { text-align: center; max-width: 92%; }
    .main-message h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(22px, 5.8vw, 34px);
      line-height: 1.45; color: #ffe0e8;
      opacity: 0; animation: fadeUp 1.15s 0.2s forwards;
    }
    .main-message .from {
      font-size: 16px; color: #ff9ec0; margin-top: 16px;
      opacity: 0; animation: fadeUp 1.15s 0.55s forwards;
    }

    /* ========== STAGE 5 : SPHERE ========== */
    #stage5 {
      background: #050208;
      overflow: hidden;
    }
    .sphere-scene {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      perspective: 1400px;
      perspective-origin: 50% 50%;
    }
    .sphere {
      width: 1px; height: 1px;
      transform-style: preserve-3d;
      /* continuous infinite spin – never stops */
      animation: spinY 48s linear infinite;
    }
    @keyframes spinY {
      from { transform: rotateY(0deg); }
      to   { transform: rotateY(360deg); }
    }
    .sphere-item {
      position: absolute;
      width: 82px; height: 100px;
      left: -41px; top: -50px;
      border-radius: 11px;
      overflow: hidden;
      box-shadow: 0 8px 22px rgba(0,0,0,0.6);
      border: 1.5px solid rgba(255,140,170,0.25);
      cursor: pointer;
      backface-visibility: hidden;
      transition: filter 0.3s ease, box-shadow 0.3s ease;
      will-change: transform;
    }
    .sphere-item img {
      width: 100%; height: 100%;
      object-fit: cover; display: block;
      pointer-events: none;
    }
    .sphere-item:hover {
      filter: brightness(1.18);
      box-shadow: 0 10px 28px rgba(255,80,120,0.35);
    }

    /* ===== POP OVERLAY (smooth pop in / out) ===== */
    .pop-overlay {
      position: absolute; inset: 0;
      background: rgba(0,0,0,0);
      display: flex; align-items: center; justify-content: center;
      z-index: 30;
      pointer-events: none;
      transition: background 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .pop-overlay.active {
      background: rgba(0,0,0,0.62);
      pointer-events: auto;
    }

    .pop-card {
      position: relative;
      width: min(290px, 74vw);
      height: min(360px, 60vh);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 25px 70px rgba(255,50,110,0.4);
      /* start state */
      transform: scale(0.55) translateY(30px);
      opacity: 0;
      transition:
        transform 0.55s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.45s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: transform, opacity;
    }
    .pop-overlay.active .pop-card {
      transform: scale(1) translateY(0);
      opacity: 1;
    }
    /* closing state (when removing active) – handled by same transition */
    .pop-card img {
      width: 100%; height: 100%;
      object-fit: cover; display: block;
    }

    .pop-side {
      position: absolute;
      top: 50%; transform: translateY(-50%);
      font-family: 'Playfair Display', serif;
      font-size: clamp(20px, 5vw, 28px);
      color: rgba(255,235,245,0.92);
      letter-spacing: 1.5px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.5s cubic-bezier(0.22, 1, 0.36, 1) 0.12s;
    }
    .pop-overlay.active .pop-side { opacity: 1; }
    .pop-left  { left: 5%; }
    .pop-right { right: 5%; }

    /* Final bottom text */
    .final-wrap {
      position: absolute; bottom: 26px; left: 0; right: 0;
      text-align: center; z-index: 15;
      pointer-events: none;
      opacity: 0;
      animation: fadeUp 1.3s 1.1s forwards;
    }
    .final-wrap p {
      font-size: 14px; line-height: 1.6; color: #f0c8d4;
      max-width: 340px; margin: 0 auto 8px; padding: 0 18px;
    }
    .final-wrap .from-name {
      font-family: 'Playfair Display', serif;
      font-size: 17px; color: #ff6b9d;
    }

    /* shared animations */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      .board {
        grid-template-columns: repeat(3, 74px);
        grid-template-rows: repeat(3, 74px);
      }
      .cell svg { width: 34px; height: 34px; }
      .sphere-item {
        width: 66px; height: 82px;
        left: -33px; top: -41px;
      }
      .love-card { padding: 38px 42px; }
      .pop-card {
        width: min(260px, 78vw);
        height: min(320px, 55vh);
      }
    }
  </style>
</head>
<body>

  <!-- STAGE 1 -->
  <div id="stage1" class="stage active">
    <div class="love-card">
      <svg class="heart-svg" id="heartIcon" viewBox="0 0 24 24" fill="none" stroke="#f0c0d0" stroke-width="1.6">
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
      </svg>
      <h2>Love mode</h2>
      <div class="toggle" id="loveToggle">
        <span class="toggle-label label-off">OFF</span>
        <span class="toggle-label label-on">ON</span>
        <div class="toggle-knob">
          <svg viewBox="0 0 24 24" fill="none" stroke="#e91e63" stroke-width="2">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
          </svg>
        </div>
      </div>
    </div>
  </div>

  <!-- STAGE 2 -->
  <div id="stage2" class="stage">
    <p class="game-title">Let's play a little game...</p>
    <div class="board" id="board"></div>
    <div class="win-text" id="winText">
      <h2>Kamu Memenangkan</h2>
      <p>Hatiku</p>
    </div>
  </div>

  <!-- STAGE 3 -->
  <div id="stage3" class="stage">
    <div class="meter-container">
      <div class="meter-arc">
        <svg viewBox="0 0 230 125">
          <defs>
            <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#ff2d55"/>
              <stop offset="55%" stop-color="#ff6b9d"/>
              <stop offset="100%" stop-color="#ffb6c1"/>
            </linearGradient>
          </defs>
          <path class="meter-bg" d="M 22 115 A 93 93 0 0 1 208 115"/>
          <path class="meter-fill" id="meterFill" d="M 22 115 A 93 93 0 0 1 208 115"/>
        </svg>
        <div class="meter-percent" id="meterPercent">0%</div>
      </div>
      <div class="meter-label">Love Intensity</div>
      <div class="meter-bar"><div class="meter-bar-fill" id="meterBar"></div></div>
    </div>
  </div>

  <!-- STAGE 4 -->
  <div id="stage4" class="stage">
    <div class="main-message">
      <h1>ini bukti sayangku ke<br>aisyahummulmukmin</h1>
      <p class="from">— dari rasyad fatahullah</p>
    </div>
  </div>

  <!-- STAGE 5 -->
  <div id="stage5" class="stage">
    <div class="sphere-scene">
      <div class="sphere" id="sphere"></div>
    </div>

    <div class="pop-overlay" id="popOverlay">
      <span class="pop-side pop-left">My</span>
      <div class="pop-card">
        <img id="popImg" src="" alt="">
      </div>
      <span class="pop-side pop-right">Everything</span>
    </div>

    <div class="final-wrap">
      <p>terimakasih nah sayangku mauki bertahan sejauh ini</p>
      <p class="from-name">dari rsyadd yang paling ganteng</p>
    </div>
  </div>

  <audio id="bgMusic" loop preload="auto">
    <source src="audio/backsound.mp3" type="audio/mpeg">
  </audio>

  <script>
    const basePhotos = [
      'images/262365.jpg','images/262369.jpg','images/262374.jpg','images/262376.jpg',
      'images/262377.jpg','images/262379.jpg','images/262380.jpg','images/262381.jpg',
      'images/262382.jpg','images/262383.jpg'
    ];
    // denser sphere
    const photos = [];
    for (let i = 0; i < 6; i++) photos.push(...basePhotos);

    const music = document.getElementById('bgMusic');
    music.volume = 0.72;

    // ========== STAGE 1 ==========
    const toggle = document.getElementById('loveToggle');
    const heartIcon = document.getElementById('heartIcon');
    toggle.addEventListener('click', () => {
      if (toggle.classList.contains('on')) return;
      toggle.classList.add('on');
      heartIcon.setAttribute('fill', '#ff2d55');
      heartIcon.setAttribute('stroke', '#ff2d55');
      music.play().catch(() => {});
      setTimeout(() => goTo(2), 900);
    });

    // ========== STAGE 2 ==========
    const board = document.getElementById('board');
    let cells = [], moves = 0, over = false;

    const svgX = `<svg viewBox="0 0 24 24" fill="none" stroke="#ff6b9d" stroke-width="2.4" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>`;
    const svgO = `<svg viewBox="0 0 24 24" fill="none" stroke="#ffb6c1" stroke-width="2.2"><circle cx="12" cy="12" r="8"/></svg>`;
    const svgHeart = `<svg viewBox="0 0 24 24" fill="#ff2d55" stroke="none"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>`;

    function createBoard() {
      board.innerHTML = '';
      cells = []; moves = 0; over = false;
      for (let i = 0; i < 9; i++) {
        const c = document.createElement('div');
        c.className = 'cell';
        c.addEventListener('click', () => onCell(c));
        board.appendChild(c);
        cells.push(c);
      }
    }

    function onCell(cell) {
      if (over || cell.classList.contains('filled')) return;
      cell.classList.add('filled');
      moves++;
      if (moves === 1) cell.innerHTML = svgX;
      else if (moves === 2) cell.innerHTML = svgO;
      else if (moves === 3) cell.innerHTML = svgX;
      else { toHearts(); return; }

      if (moves === 1) {
        setTimeout(() => {
          const empty = cells.filter(c => !c.classList.contains('filled'));
          if (empty.length) {
            const o = empty[Math.floor(Math.random() * empty.length)];
            o.classList.add('filled');
            o.innerHTML = svgO;
            moves++;
          }
        }, 400);
      } else if (moves === 3) {
        setTimeout(() => {
          const empty = cells.filter(c => !c.classList.contains('filled'));
          if (empty.length) {
            empty[0].classList.add('filled');
            empty[0].innerHTML = svgO;
            moves++;
            setTimeout(toHearts, 580);
          }
        }, 400);
      }
    }

    function toHearts() {
      over = true;
      cells.forEach((c, i) => {
        setTimeout(() => {
          c.classList.add('filled');
          c.innerHTML = svgHeart;
        }, i * 75);
      });
      setTimeout(() => {
        document.getElementById('winText').classList.add('show');
        setTimeout(() => goTo(3), 2100);
      }, 850);
    }

    // ========== STAGE 3 ==========
    function startMeter() {
      const fill = document.getElementById('meterFill');
      const pct  = document.getElementById('meterPercent');
      const bar  = document.getElementById('meterBar');
      const start = performance.now();
      const dur = 2700;
      function tick(now) {
        const p = Math.min((now - start) / dur, 1);
        const e = 1 - Math.pow(1 - p, 3); // easeOutCubic
        const v = Math.floor(e * 100);
        pct.textContent = v + '%';
        fill.style.strokeDashoffset = 290 - 290 * e;
        bar.style.width = v + '%';
        if (p < 1) requestAnimationFrame(tick);
        else setTimeout(() => goTo(4), 1200);
      }
      requestAnimationFrame(tick);
    }

    // ========== STAGE 4 ==========
    function showMsg() {
      setTimeout(() => goTo(5), 3600);
    }

    // ========== STAGE 5 : continuous sphere ==========
    function buildSphere() {
      const sphere = document.getElementById('sphere');
      sphere.innerHTML = '';
      const n = photos.length;
      const radius = 220;

      photos.forEach((src, i) => {
        const item = document.createElement('div');
        item.className = 'sphere-item';

        // Fibonacci sphere distribution (even + dense)
        const y = 1 - (i / (n - 1)) * 2;
        const r = Math.sqrt(Math.max(0, 1 - y * y));
        const theta = Math.PI * (3 - Math.sqrt(5)) * i;

        const x  = Math.cos(theta) * r * radius;
        const z  = Math.sin(theta) * r * radius;
        const yy = y * radius * 0.88;

        item.style.transform = `translate3d(${x}px, ${yy}px, ${z}px)`;

        const img = document.createElement('img');
        img.src = src;
        img.alt = '';
        img.loading = 'lazy';
        item.appendChild(img);

        item.addEventListener('click', (e) => {
          e.stopPropagation();
          openPop(src);
        });
        sphere.appendChild(item);
      });
    }

    // Smooth pop in / out
    let isPopOpen = false;
    function openPop(src) {
      if (isPopOpen) return;
      isPopOpen = true;
      document.getElementById('popImg').src = src;
      const ov = document.getElementById('popOverlay');
      ov.classList.add('active');
      // keep spinning – never pause the sphere
    }

    function closePop() {
      if (!isPopOpen) return;
      const ov = document.getElementById('popOverlay');
      ov.classList.remove('active');
      // wait for transition to finish before allowing next open
      setTimeout(() => { isPopOpen = false; }, 480);
    }

    document.getElementById('popOverlay').addEventListener('click', closePop);

    // ========== Navigation ==========
    function goTo(n) {
      document.querySelectorAll('.stage').forEach(s => s.classList.remove('active'));
      document.getElementById('stage' + n).classList.add('active');
      if (n === 2) createBoard();
      if (n === 3) startMeter();
      if (n === 4) showMsg();
      if (n === 5) buildSphere();
    }
  </script>
</body>
</html>
